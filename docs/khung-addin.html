<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DA Assist</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root{
    --nen:#12161c; --nen-2:#1a2029; --nen-3:#212936; --vien:#2f3947;
    --chu:#e6ebf2; --chu-mo:#9aa7b8;
    --nhan:#7fb3ff; --do:#ff7b72; --vang:#e3b341; --luc:#56d364;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--nen);color:var(--chu);
    font:13.5px/1.5 "Segoe UI",system-ui,sans-serif}
  header{padding:12px 14px;border-bottom:1px solid var(--vien);background:var(--nen-2)}
  h1{margin:0;font-size:15px}
  .rieng-tu{margin:4px 0 0;font-size:11.5px;color:var(--luc)}
  main{padding:12px 14px 40px}

  .the{background:var(--nen-2);border:1px solid var(--vien);border-radius:8px;
    padding:11px 12px;margin:10px 0}
  .the h2{margin:0 0 9px;font-size:12px;color:var(--nhan);
    text-transform:uppercase;letter-spacing:.05em}
  .luoi{display:flex;flex-wrap:wrap;gap:14px}
  .so{font-size:18px;font-weight:600;line-height:1.1}
  .so small{display:block;font-size:11px;font-weight:400;color:var(--chu-mo);margin-top:2px}

  button.thao-tac{background:var(--nen-3);color:var(--chu);border:1px solid var(--vien);
    border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer;width:100%;margin:5px 0}
  button.thao-tac:hover{border-color:var(--nhan);color:var(--nhan)}
  button.thao-tac.chinh{background:var(--nhan);color:#0b1220;border-color:var(--nhan);font-weight:600}
  button.thao-tac.chinh:hover{color:#0b1220}
  button.thao-tac:disabled{opacity:.5;cursor:default}
  select{background:var(--nen-3);color:var(--chu);border:1px solid var(--vien);
    border-radius:6px;padding:6px 9px;font:inherit;width:100%;margin:4px 0 8px}

  .bao{border-left:3px solid var(--vien);padding:8px 10px;margin:7px 0;
    background:var(--nen-3);border-radius:0 6px 6px 0}
  .bao.chac-chan{border-left-color:var(--do)}
  .bao.can-xac-minh{border-left-color:var(--vang)}
  .bao.ghi-nhan{border-left-color:var(--chu-mo)}
  .bao .cot{font-weight:600}
  .bao .dem{color:var(--chu-mo);font-size:12px}
  .bao p{margin:4px 0 0;font-size:12.5px}
  .bao .de-xuat{color:var(--luc)}
  .bao .vi-du{font:11.5px/1.5 ui-monospace,Consolas,monospace;color:var(--chu-mo);
    white-space:pre-wrap}
  .luu-y{background:#2a2113;border:1px solid #5a4416;border-radius:7px;
    padding:9px 11px;margin:9px 0;font-size:12.5px}
  .mo{color:var(--chu-mo);font-size:12px}
  .loi{color:var(--do)}
  .an{display:none}
  .cuon{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{border:1px solid var(--vien);padding:4px 6px;text-align:left}
  th{background:var(--nen-3)}
  td.so-lieu{text-align:right;font-variant-numeric:tabular-nums}
  tr.muc td{background:var(--nen-3);color:var(--nhan);font-weight:600}

  .dx{border:1px solid var(--vien);border-radius:7px;padding:9px 10px;margin:7px 0;
    background:var(--nen-3)}
  .dx.tat{opacity:.5}
  .dx label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
  .dx input{margin-top:3px;width:15px;height:15px;flex:0 0 15px;accent-color:var(--nhan)}
  .dx .ten{font-weight:600;font-size:12.5px}
  .dx .mo-ta{display:block;margin-top:3px;font-size:11.5px;color:var(--chu-mo)}
  .dx .canh{display:block;margin-top:4px;font-size:11.5px;color:var(--vang)}
  .cu{color:var(--do);font-family:ui-monospace,Consolas,monospace}
  .moi{color:var(--luc);font-family:ui-monospace,Consolas,monospace}

  .lop-phu{position:fixed;inset:0;background:rgba(6,9,13,.82);display:flex;
    align-items:center;justify-content:center;padding:10px;z-index:50}
  .hop{background:var(--nen-2);border:1px solid var(--vien);border-radius:10px;
    width:100%;max-height:94vh;overflow-y:auto;padding:14px}
  .hop .tien-do{font-size:11px;color:var(--chu-mo);text-transform:uppercase;letter-spacing:.05em}
  .hop h3{margin:6px 0 8px;font-size:14.5px;line-height:1.35}
  .hop .mo-ta{margin:0 0 10px;font-size:12.5px}
  .hop .vi-du{font:11.5px/1.5 ui-monospace,Consolas,monospace;color:var(--chu-mo);
    background:var(--nen-3);border-radius:6px;padding:7px 9px;margin:0 0 10px;white-space:pre-wrap}
  .chon-mot{display:block;width:100%;text-align:left;background:var(--nen-3);
    border:1px solid var(--vien);border-radius:7px;padding:9px 10px;margin:6px 0;
    cursor:pointer;font:inherit;color:var(--chu)}
  .chon-mot:hover{border-color:var(--nhan)}
  .chon-mot .nhan{font-weight:600;display:block;font-size:12.5px}
  .chon-mot .phu{display:block;margin-top:3px;font-size:11.5px;color:var(--chu-mo)}
  .chon-mot.goi-y .nhan::after{content:" — gợi ý";color:var(--luc);font-weight:400;font-size:11.5px}
  .vi-sao{margin:10px 0 0;padding-top:9px;border-top:1px solid var(--vien);
    font-size:11.5px;color:var(--chu-mo)}
</style>
</head>
<body>
<header>
  <h1>DA Assist</h1>
  <p class="rieng-tu">Chạy trong máy này. Không gửi dữ liệu đi đâu.</p>
</header>

<main>
  <div id="khoi-dau" class="the">
    <h2>Bắt đầu</h2>
    <p class="mo" id="tinh-trang">Đang kết nối với Excel…</p>
    <button class="thao-tac chinh" id="nut-doc" disabled>Rà soát trang tính đang mở</button>
  </div>
  <div id="ket-qua"></div>
</main>

<div id="lop-hoi" class="an"></div>

<script type="module">
import {
  raSoat, dungPhuLuc4, sinhCauHoi, VIEC, heQuaKhoa,
  hoSoMoi, ghiTraLoi, docTraLoi, quyetDinhTu, doKhop,
  sangJson, tuJson, chuKyCauTruc,
  deXuatSua, apDung, trangNhatKy,
  lietKePhanTich, chayPhanTich, phanTichThanhHang, TEN_NHOM, NGUONG_MAC_DINH,
} from "../src/index.js";
import { docTrangHienTai } from "../src/vo-addin/doc-excel.js";
import { ghiNhieuTrang } from "../src/vo-addin/ghi-excel.js";
import { veBieuDo, veO } from "./bieu-do.js";

const khung = document.getElementById("ket-qua");
const lopHoi = document.getElementById("lop-hoi");
const nutDoc = document.getElementById("nut-doc");
const tinhTrang = document.getElementById("tinh-trang");

let kq = null;
let hoSo = null;
let tenTrangGoc = "";

/* ── Chờ Office sẵn sàng ───────────────────────────────────────────── */

if (typeof Office === "undefined") {
  tinhTrang.innerHTML = `<span class="loi">Trang này là bảng điều khiển của add-in,
    phải mở từ trong Excel.</span> Nếu bạn muốn dùng mà không cài đặt gì,
    hãy dùng bản chạy trên trình duyệt ở trang chủ.`;
} else {
  Office.onReady((tin) => {
    if (tin.host !== Office.HostType.Excel) {
      tinhTrang.innerHTML = `<span class="loi">Add-in này chỉ chạy trong Excel.</span>`;
      return;
    }
    tinhTrang.textContent = "Đã kết nối. Mở trang tính cần rà soát rồi bấm nút bên dưới.";
    nutDoc.disabled = false;
  });
}

nutDoc.addEventListener("click", docBang);

function thoat(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function hienKhoangTrang(s) {
  const v = String(s == null ? "" : s);
  if (v === "") return `<i class="mo">(để trống)</i>`;
  return thoat(v
    .replace(/^[ \t]+/, (m) => "␣".repeat(m.length))
    .replace(/[ \t]+$/, (m) => "␣".repeat(m.length))
    .replace(/[ \t]{2,}/g, (m) => "␣".repeat(m.length)));
}

/* ── Đọc bảng tính đang mở ─────────────────────────────────────────── */

async function docBang() {
  nutDoc.disabled = true;
  const nhan = nutDoc.textContent;
  try {
    const t0 = performance.now();
    const vung = await docTrangHienTai(Excel, {
      tienTrinh: (a, b) => { nutDoc.textContent = `Đang đọc ${a.toLocaleString("vi-VN")}/${b.toLocaleString("vi-VN")} dòng…`; },
    });
    if (!vung.hang.length) {
      khung.innerHTML = `<div class="the"><h2>Trang tính rỗng</h2>
        <p class="mo">Trang tính đang mở không có dữ liệu. Hãy chuyển sang trang khác rồi thử lại.</p></div>`;
      return;
    }
    tenTrangGoc = vung.ten;
    kq = raSoat(vung);
    hoSo = napHoSo(kq.bang);
    ve(((performance.now() - t0) / 1000).toFixed(2));
  } catch (e) {
    khung.innerHTML = `<div class="the"><h2>Không đọc được</h2>
      <p class="loi">${thoat(e.message)}</p></div>`;
  } finally {
    nutDoc.disabled = false;
    nutDoc.textContent = nhan;
  }
}

/* ── Hồ sơ đơn vị ──────────────────────────────────────────────────── */

function bam(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
const khoaLuu = (bang) => "da-assist:hs:" + bam(chuKyCauTruc(bang));

function napHoSo(bang) {
  try {
    const t = localStorage.getItem(khoaLuu(bang));
    if (t) {
      const h = tuJson(t);
      if (doKhop(h, bang) > 0.8) return h;
    }
  } catch (e) { /* hồ sơ hỏng thì dựng mới */ }
  return hoSoMoi(bang, { ten: bang.ten });
}

function luuHoSo() {
  try { localStorage.setItem(khoaLuu(kq.bang), sangJson(hoSo)); } catch (e) { /* bỏ qua */ }
}

/* ── Hộp thoại phỏng vấn ───────────────────────────────────────────── */

function phongVan(viec, cotLienQuan = null) {
  const ds = sinhCauHoi(kq.bang, kq.nhanDang.theoVaiTro, {
    viec, cotLienQuan, daTraLoi: docTraLoi(hoSo),
  }).canHoi;
  if (!ds.length) return Promise.resolve(true);

  return new Promise((xong) => {
    let i = 0;
    lopHoi.classList.remove("an");
    const dong = (ok) => { lopHoi.classList.add("an"); lopHoi.innerHTML = ""; xong(ok); };
    const tiep = () => { i++; if (i >= ds.length) dong(true); else veCau(); };

    const veCau = () => {
      const c = ds[i];
      lopHoi.innerHTML = `
        <div class="lop-phu"><div class="hop">
          <div class="tien-do">Câu ${i + 1} / ${ds.length}</div>
          <h3>${thoat(c.tieuDe)}</h3>
          <p class="mo-ta">${thoat(c.moTa)}</p>
          ${c.viDu && c.viDu.length
            ? `<p class="vi-du">Giá trị có thật trong tệp:\n${thoat(c.viDu.join("\n"))}</p>` : ""}
          ${c.luaChon.map((l, k) => `<button class="chon-mot ${l.ma === c.goiY ? "goi-y" : ""}" data-k="${k}">
              <span class="nhan">${thoat(l.nhan)}</span>
              ${l.moTa ? `<span class="phu">${thoat(l.moTa)}</span>` : ""}
            </button>`).join("")}
          <p class="vi-sao"><b>Vì sao hỏi:</b> ${thoat(c.viSaoHoi)}</p>
          <button class="thao-tac" id="nut-bo-qua">Bỏ qua câu này</button>
          <button class="thao-tac" id="nut-huy">Huỷ</button>
        </div></div>`;
      lopHoi.querySelectorAll(".chon-mot").forEach((b) =>
        b.addEventListener("click", () => {
          ghiTraLoi(hoSo, c.ma, c.luaChon[+b.dataset.k].ma);
          luuHoSo();
          tiep();
        }));
      document.getElementById("nut-bo-qua").addEventListener("click", tiep);
      document.getElementById("nut-huy").addEventListener("click", () => dong(false));
    };
    veCau();
  });
}

/* ── Màn hình chính ────────────────────────────────────────────────── */

function ve(giay) {
  const tenHinh = { "danh-sach": "danh sách từng ca", "bieu-tong-hop": "biểu đã cộng",
    "chua-xac-dinh": "chưa xác định" }[kq.tomTat.hinhDang];
  const laDanhSach = kq.tomTat.hinhDang !== "bieu-tong-hop";
  const laHivInfo = kq.nhanDang.ketQua === "nhan-ra"
    && kq.nhanDang.hoSo.ma === "hivinfo-giam-sat-ca-benh";

  const nhomBao = (muc) => {
    const ds = kq.phatHien.filter((p) => p.mucDo === muc);
    if (!ds.length) return `<p class="mo">Không có mục nào.</p>`;
    return ds.slice(0, 40).map((p) => `<div class="bao ${p.mucDo}">
      <span class="cot">${thoat(p.cot)}</span>
      ${p.soDong ? `<span class="dem"> · ${p.soDong.toLocaleString("vi-VN")} dòng</span>` : ""}
      <p>${thoat(p.moTa)}</p>
      ${p.viDu && p.viDu.length ? `<p class="vi-du">${thoat(p.viDu.slice(0, 4).join("\n"))}</p>` : ""}
      ${p.deXuat ? `<p class="de-xuat">→ ${thoat(p.deXuat)}</p>` : ""}
    </div>`).join("") + (ds.length > 40 ? `<p class="mo">…còn ${ds.length - 40} mục.</p>` : "");
  };

  khung.innerHTML = `
    <div class="the">
      <h2>${thoat(tenTrangGoc)}</h2>
      <div class="luoi">
        <div class="so">${kq.tomTat.soDong.toLocaleString("vi-VN")}<small>dòng</small></div>
        <div class="so">${kq.tomTat.soCot}<small>cột</small></div>
        <div class="so">${giay}s<small>đọc xong</small></div>
      </div>
      <p style="margin:10px 0 0;font-size:12.5px">${thoat(
        laDanhSach ? kq.nhanDang.moTa : (kq.nhanDangBieu && kq.nhanDangBieu.moTa) || ""
      )}</p>
      <p class="mo">Hình dạng: ${tenHinh} · tiêu đề ở dòng ${kq.tomTat.hangTieuDe}</p>
      ${kq.canhBaoLuong.map((c) => `<div class="luu-y">${thoat(c)}</div>`).join("")}
    </div>

    <div class="the">
      <h2>Việc cần làm</h2>
      ${laDanhSach ? `<button class="thao-tac chinh" id="nut-sach">Làm sạch dữ liệu</button>` : ""}
      ${laDanhSach ? `<button class="thao-tac chinh" id="nut-trung">Tìm bản ghi trùng</button>` : ""}
      ${laDanhSach ? `<button class="thao-tac chinh" id="nut-phan-tich">Phân tích số liệu</button>` : ""}
      ${laHivInfo ? `<button class="thao-tac chinh" id="nut-bieu">Dựng Phụ lục 4</button>` : ""}
      <div id="khung-viec"></div>
    </div>

    <div class="the"><h2>Cần sửa (${kq.tomTat.soChacChan})</h2>${nhomBao("chac-chan")}</div>
    <div class="the"><h2>Cần xem lại (${kq.tomTat.soCanXacMinh})</h2>${nhomBao("can-xac-minh")}</div>
    <div class="the"><h2>Ghi nhận (${kq.tomTat.soGhiNhan})</h2>${nhomBao("ghi-nhan")}</div>`;

  const g = (id) => document.getElementById(id);
  if (g("nut-sach")) g("nut-sach").addEventListener("click", lamLamSach);
  if (g("nut-trung")) g("nut-trung").addEventListener("click", lamTimTrung);
  if (g("nut-bieu")) g("nut-bieu").addEventListener("click", lamBieuMau);
  if (g("nut-phan-tich")) g("nut-phan-tich").addEventListener("click", veDanhMucPhanTich);
}

/* ── Phân tích số liệu ─────────────────────────────────────────────── */

let maDangXem = null;
let tuyChonPT = {};

function veDanhMucPhanTich() {
  const ds = lietKePhanTich(kq.bang, kq.nhanDang.theoVaiTro, { qd: quyetDinhTu(hoSo, kq.bang) });
  const soChay = ds.filter((x) => x.chayDuoc).length;

  document.getElementById("khung-viec").innerHTML = `
    <p style="font-size:12.5px;margin:0 0 8px"><b>${soChay}</b>/${ds.length} phân tích
      chạy được với tệp này. Những cái còn lại vẫn hiện kèm lý do.</p>
    <label style="font-size:12.5px;display:block;margin-bottom:8px">
      <input type="checkbox" id="che-o-nho" style="width:15px;height:15px;accent-color:var(--nhan);vertical-align:-2px">
      Che ô nhỏ hơn ${NGUONG_MAC_DINH} — bật khi định sao chép ra ngoài</label>
    ${["A", "B", "C", "D"].map((n) => `
      <div class="mo" style="text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px">
        Nhóm ${n} — ${thoat(TEN_NHOM[n])}</div>
      ${ds.filter((x) => x.nhom === n).map((x) => `
        <div class="dx ${x.chayDuoc ? "" : "tat"}">
          <div style="display:flex;gap:8px;align-items:baseline">
            <span class="mo" style="font-family:ui-monospace,Consolas,monospace">${x.ma}</span>
            <span class="ten">${thoat(x.ten)}</span>
          </div>
          ${x.chayDuoc
            ? `<button class="thao-tac" data-pt="${x.ma}" style="margin:6px 0 0">Xem</button>`
            : `<span class="canh">${thoat(x.lyDo)}</span>`}
        </div>`).join("")}`).join("")}
    <div id="khung-kq-pt"></div>`;

  document.querySelectorAll("#khung-viec button[data-pt]").forEach((b) =>
    b.addEventListener("click", async () => {
      const pt = ds.find((x) => x.ma === b.dataset.pt);
      if (pt.chiSoCot.length && !(await phongVan(VIEC.PHAN_TICH, pt.chiSoCot))) return;
      xemPhanTich(b.dataset.pt);
    }));
  document.getElementById("che-o-nho").addEventListener("change", () => {
    if (maDangXem) xemPhanTich(maDangXem);
  });
}

function xemPhanTich(ma) {
  maDangXem = ma;
  const che = document.getElementById("che-o-nho").checked;
  const r = chayPhanTich(kq.bang, kq.nhanDang.theoVaiTro, ma, {
    qd: quyetDinhTu(hoSo, kq.bang),
    phatHien: kq.phatHien,
    tuyChonPhanTich: tuyChonPT[ma] || {},
    che,
    nguong: NGUONG_MAC_DINH,
  });
  const o = document.getElementById("khung-kq-pt");
  if (!r.chayDuoc) {
    o.innerHTML = `<p class="canh">${thoat(r.lyDo)}</p>`;
    return;
  }

  const veBang = (b, ten) => {
    const dd = b.dinhDang || b.tieuDe.map((_, i) => (i === 0 ? "chu" : "so"));
    return `${ten ? `<div class="mo" style="margin:10px 0 4px">${thoat(ten)}</div>` : ""}
      <div class="cuon"><table>
        <thead><tr>${b.tieuDe.map((t) => `<th>${thoat(t)}</th>`).join("")}</tr></thead>
        <tbody>${b.hang.map((h) => `<tr>${h.map((v, i) =>
          `<td class="${dd[i] === "chu" ? "" : "so-lieu"}">${thoat(veO(v, dd[i]))}</td>`).join("")}</tr>`).join("")}</tbody>
        ${b.tongCot ? `<tfoot><tr>${b.tongCot.map((v, i) =>
          `<th class="${dd[i] === "chu" ? "" : "so-lieu"}">${thoat(veO(v, dd[i]))}</th>`).join("")}</tr></tfoot>` : ""}
      </table></div>`;
  };

  const pt = lietKePhanTich(kq.bang, kq.nhanDang.theoVaiTro).find((x) => x.ma === ma);
  const chonTC = pt && pt.tuyChon
    ? Object.entries(pt.tuyChon).map(([khoa, t]) => `
        <select data-khoa="${khoa}">${t.muc.map((m) => `<option value="${m.ma}"
          ${(tuyChonPT[ma] || {})[khoa] === m.ma || (!((tuyChonPT[ma] || {})[khoa]) && m.ma === t.macDinh) ? "selected" : ""}
          >${thoat(m.ten)}</option>`).join("")}</select>`).join("")
    : "";

  o.innerHTML = `<div class="the" style="margin-top:12px">
    <h2>${thoat(r.ma)}. ${thoat(r.ten)}</h2>
    ${chonTC}
    ${r.bieuDo ? veBieuDo(r.bieuDo, { rong: 380, cao: 200 }) : ""}
    ${veBang(r.bang, null)}
    ${(r.bangPhu || []).map((x) => veBang(x.bang, x.ten)).join("")}
    ${r.canCu ? `<p class="mo" style="color:var(--nhan);margin:8px 0 0">Căn cứ: ${thoat(r.canCu)}</p>` : ""}
    ${(r.ghiChu || []).map((g) => `<div class="luu-y">${thoat(g)}</div>`).join("")}
    <button class="thao-tac" id="nut-ghi-pt">Ghi bảng sang trang tính mới</button>
  </div>`;

  o.querySelectorAll("select[data-khoa]").forEach((s) =>
    s.addEventListener("change", () => {
      tuyChonPT[ma] = { ...(tuyChonPT[ma] || {}), [s.dataset.khoa]: s.value };
      xemPhanTich(ma);
    }));

  document.getElementById("nut-ghi-pt").addEventListener("click", async () => {
    const nut = document.getElementById("nut-ghi-pt");
    nut.disabled = true;
    try {
      const ten = await ghiNhieuTrang(Excel, [
        { ten: `Phan tich ${r.ma}`, hang: phanTichThanhHang(r) },
      ]);
      nut.textContent = `Đã ghi sang trang “${ten[0]}”`;
    } catch (e) {
      alert("Không ghi được: " + e.message);
      nut.textContent = "Ghi bảng sang trang tính mới";
    } finally {
      nut.disabled = false;
    }
  });
}

/* ── Làm sạch, rồi ghi sang trang tính mới ─────────────────────────── */

async function lamLamSach() {
  const dx0 = deXuatSua(kq.bang, kq.phatHien, quyetDinhTu(hoSo, kq.bang));
  const cot = new Set(dx0.flatMap((d) => d.thayDoi.map((t) => t.cot)));
  const bc = sinhCauHoi(kq.bang, kq.nhanDang.theoVaiTro).bangChung;
  for (const gt of bc.giaTriHiem) cot.add(gt.cot.chiSo);
  if (!(await phongVan(VIEC.SUA_DU_LIEU, [...cot]))) return;

  const dx = deXuatSua(kq.bang, kq.phatHien, quyetDinhTu(hoSo, kq.bang));
  const o = document.getElementById("khung-viec");
  if (!dx.length) {
    o.innerHTML = `<p class="mo">Không có phép sửa nào để đề xuất.</p>`;
    return;
  }

  o.innerHTML = dx.map((d, i) => `
    <div class="dx" data-i="${i}">
      <label><input type="checkbox" data-i="${i}" checked>
        <span><span class="ten">${thoat(d.nhan)}</span>
          <span class="mo"> — ${d.boDong ? `${d.soDong} dòng` : `${d.soO.toLocaleString("vi-VN")} ô`}</span>
          <span class="mo-ta">${thoat(d.moTa)}</span>
          ${d.canhBao ? `<span class="canh">${thoat(d.canhBao)}</span>` : ""}
        </span></label>
      ${d.xemTruoc.length ? `<div class="cuon"><table><tbody>${d.xemTruoc.slice(0, 4).map((x) =>
        `<tr><td>${x.dong}</td><td class="cu">${hienKhoangTrang(x.cu)}</td>
         <td class="moi">${hienKhoangTrang(x.moi)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    </div>`).join("")
    + `<div id="tom-tat-chon" class="mo" style="margin:8px 0"></div>
       <button class="thao-tac chinh" id="nut-ghi">Ghi sang trang tính mới</button>
       <p class="mo">Dữ liệu gốc <b>không bị thay đổi</b>. Công cụ tạo hai trang tính mới
         trong chính sổ tính này: một trang dữ liệu đã sửa và một trang nhật ký.</p>`;

  const capNhat = () => {
    let soO = 0; let soDong = 0; let soNhom = 0;
    o.querySelectorAll('input[type=checkbox]').forEach((c) => {
      const d = dx[+c.dataset.i];
      o.querySelector(`.dx[data-i="${c.dataset.i}"]`).classList.toggle("tat", !c.checked);
      if (!c.checked) return;
      soNhom++; soO += d.soO; if (d.boDong) soDong += d.boDong.length;
    });
    document.getElementById("tom-tat-chon").innerHTML = soNhom
      ? `Đã chọn ${soNhom} nhóm: sửa <b>${soO.toLocaleString("vi-VN")}</b> ô, bỏ <b>${soDong}</b> dòng.`
      : "Chưa chọn nhóm nào.";
  };
  o.querySelectorAll('input[type=checkbox]').forEach((c) => c.addEventListener("change", capNhat));
  capNhat();

  document.getElementById("nut-ghi").addEventListener("click", async () => {
    const nut = document.getElementById("nut-ghi");
    const chon = [...o.querySelectorAll('input[type=checkbox]')]
      .filter((c) => c.checked).map((c) => dx[+c.dataset.i].ma);
    if (!chon.length) { alert("Chưa chọn nhóm nào."); return; }
    nut.disabled = true;
    try {
      const r = apDung(kq.bang, dx, chon);
      nut.textContent = "Đang ghi…";
      const ten = await ghiNhieuTrang(Excel, [
        { ten: `${tenTrangGoc} da lam sach`, hang: r.hang },
        trangNhatKy(r.nhatKy, r.tomTat, tenTrangGoc),
      ], { tienTrinh: (a, b) => { nut.textContent = `Đang ghi ${a}/${b} dòng…`; } });
      document.getElementById("tom-tat-chon").innerHTML =
        `Đã tạo trang <b>${thoat(ten[0])}</b> và <b>${thoat(ten[1])}</b>.
         Sửa ${r.tomTat.soODaSua.toLocaleString("vi-VN")} ô, bỏ ${r.tomTat.soDongDaBo} dòng,
         còn ${r.tomTat.soDongSau.toLocaleString("vi-VN")} dòng.`;
    } catch (e) {
      alert("Không ghi được: " + e.message);
    } finally {
      nut.disabled = false;
      nut.textContent = "Ghi sang trang tính mới";
    }
  });
}

/* ── Tìm bản ghi trùng ─────────────────────────────────────────────── */

async function lamTimTrung() {
  if (!(await phongVan(VIEC.GOP_TRUNG))) return;
  const qd = quyetDinhTu(hoSo, kq.bang);
  const o = document.getElementById("khung-viec");
  if (!qd.khoaNhanDang) {
    o.innerHTML = `<p class="mo">Bạn đã bỏ qua câu hỏi nên công cụ chưa có căn cứ. Không làm gì cả.</p>`;
    return;
  }
  if (!qd.khoaNhanDang.length) {
    o.innerHTML = `<p class="mo">Bạn chọn chưa gộp gì.</p>`;
    return;
  }
  const r = heQuaKhoa(kq.bang, qd.khoaNhanDang);
  o.innerHTML = `
    <p style="font-size:12.5px">Căn cứ: <b>${thoat(qd.khoaNhanDang.map((c) => kq.bang.tieuDe[c]).join(" + "))}</b></p>
    <div class="luoi">
      <div class="so">${r.soNhom}<small>nhóm nghi trùng</small></div>
      <div class="so">${r.soDongThua}<small>dòng thừa</small></div>
    </div>
    <div class="cuon"><table>
      <thead><tr><th>Giá trị khoá</th><th>Ở các dòng</th></tr></thead>
      <tbody>${r.nhom.slice(0, 20).map((nhom) => {
        const d = kq.bang.dong[nhom[0]];
        const gt = qd.khoaNhanDang.map((c) =>
          d[c] instanceof Date ? d[c].toISOString().slice(0, 10) : String(d[c] ?? ""));
        return `<tr><td>${thoat(gt.join(" · "))}</td><td>${nhom.map((i) => i + 2).join(", ")}</td></tr>`;
      }).join("")}</tbody></table></div>
    <div class="luu-y">Công cụ mới khoanh vùng, chưa xoá dòng nào.</div>`;
}

/* ── Phụ lục 4 ─────────────────────────────────────────────────────── */

const VAI_TRO_BIEU = ["ngay_khang_dinh", "gioi_tinh", "ngoai_tinh",
  "ket_luan_nhiem_moi", "ngay_tu_vong", "trang_thai_nguoi_nhiem"];

async function lamBieuMau() {
  const cot = VAI_TRO_BIEU.map((v) => kq.nhanDang.theoVaiTro.get(v)).filter((x) => x != null);
  if (!(await phongVan(VIEC.DUNG_BIEU_MAU, cot))) return;

  const namNay = new Date().getUTCFullYear();
  const muc = [];
  for (let n = namNay; n >= namNay - 5; n--) {
    muc.push(`<option value="${n}|">Năm ${n}</option>`);
    for (let q = 4; q >= 1; q--) muc.push(`<option value="${n}|${q}">Quý ${q} năm ${n}</option>`);
  }
  document.getElementById("khung-viec").innerHTML = `
    <select id="ky-bao-cao">${muc.join("")}</select>
    <div id="khung-bieu"></div>
    <button class="thao-tac" id="nut-ghi-bieu">Ghi biểu sang trang tính mới</button>`;
  document.getElementById("ky-bao-cao").addEventListener("change", veBieu);
  document.getElementById("nut-ghi-bieu").addEventListener("click", ghiBieu);
  veBieu();
}

function bieuHienTai() {
  const [nam, quy] = document.getElementById("ky-bao-cao").value.split("|");
  return {
    nam: +nam,
    quy: quy ? +quy : null,
    r: dungPhuLuc4(kq.bang, kq.nhanDang.theoVaiTro, { nam: +nam, quy: quy ? +quy : null }),
  };
}

function veBieu() {
  const { r } = bieuHienTai();
  const o = document.getElementById("khung-bieu");
  if (!r.dungDuoc) {
    o.innerHTML = `<p class="loi">Thiếu ${thoat(r.thieu.join(", "))}.</p>`;
    return;
  }
  o.innerHTML = `<div class="cuon"><table>
    <thead><tr><th>Nội dung</th><th>Nam</th><th>Nữ</th><th>Tổng</th></tr></thead>
    <tbody>${r.dong.map((d) => d.tieuDeMuc
      ? `<tr class="muc"><td colspan="4">${thoat(d.muc)}. ${thoat(d.noiDung)}</td></tr>`
      : `<tr><td>${thoat(d.noiDung)}</td>
         <td class="so-lieu">${d.nam}</td><td class="so-lieu">${d.nu}</td>
         <td class="so-lieu">${d.tong}</td></tr>`).join("")}</tbody></table></div>
    ${r.ghiChu.map((g) => `<div class="luu-y">${thoat(g)}</div>`).join("")}`;
}

async function ghiBieu() {
  const nut = document.getElementById("nut-ghi-bieu");
  const { nam, quy, r } = bieuHienTai();
  if (!r.dungDuoc) return;
  nut.disabled = true;
  try {
    const hang = [
      [`PHỤ LỤC 4 — BÁO CÁO TỔNG HỢP SỐ LIỆU GIÁM SÁT CA BỆNH HIV/AIDS`],
      [quy ? `Quý ${quy} năm ${nam}` : `Năm ${nam}`],
      [],
      ["STT", "Nội dung báo cáo", "Nam", "Nữ", "Tổng"],
      ...r.dong.map((d) => d.tieuDeMuc
        ? [d.muc, d.noiDung, "", "", ""]
        : [d.muc, (d.capDo > 1 ? "    " : "") + d.noiDung, d.nam, d.nu, d.tong]),
      [],
      ["Ghi chú"],
      ...r.ghiChu.map((g) => [g]),
    ];
    const ten = await ghiNhieuTrang(Excel, [{ ten: `Phu luc 4 ${quy ? "Q" + quy + " " : ""}${nam}`, hang }]);
    nut.textContent = `Đã ghi sang trang “${ten[0]}”`;
  } catch (e) {
    alert("Không ghi được: " + e.message);
    nut.textContent = "Ghi biểu sang trang tính mới";
  } finally {
    nut.disabled = false;
  }
}
</script>
