<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DA Assist — Rà soát tệp Excel</title>
<style>
  :root{
    --nen:#12161c; --nen-2:#1a2029; --nen-3:#212936; --vien:#2f3947;
    --chu:#e6ebf2; --chu-mo:#9aa7b8;
    --nhan:#7fb3ff; --do:#ff7b72; --vang:#e3b341; --luc:#56d364;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--nen);color:var(--chu);
    font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif}
  header{padding:20px 26px;border-bottom:1px solid var(--vien);background:var(--nen-2)}
  h1{margin:0;font-size:19px;letter-spacing:.01em}
  .rieng-tu{margin-top:6px;font-size:13px;color:var(--luc)}
  main{max-width:1180px;margin:0 auto;padding:24px 26px 80px}

  .tha{border:2px dashed var(--vien);border-radius:10px;padding:38px 24px;text-align:center;
    background:var(--nen-2);transition:border-color .15s,background .15s;cursor:pointer}
  .tha.treo{border-color:var(--nhan);background:var(--nen-3)}
  .tha p{margin:6px 0;color:var(--chu-mo)}
  .tha strong{color:var(--chu);font-size:16px}
  .tha.gon{padding:14px;font-size:13px}
  .tha.gon strong{font-size:14px}
  .tha.gon p{display:none}
  input[type=file]{display:none}

  .the{background:var(--nen-2);border:1px solid var(--vien);border-radius:10px;
    padding:16px 18px;margin:16px 0}
  .the h2{margin:0 0 12px;font-size:15px;color:var(--nhan);
    text-transform:uppercase;letter-spacing:.06em}
  .luoi{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end}
  .so{font-size:24px;font-weight:600;line-height:1.15}
  .so.chu{font-size:17px}
  .so small{display:block;font-size:12px;font-weight:400;color:var(--chu-mo);
    text-transform:none;letter-spacing:0;margin-top:3px}

  .tab{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab button{background:var(--nen-3);color:var(--chu-mo);border:1px solid var(--vien);
    border-radius:7px;padding:7px 14px;cursor:pointer;font:inherit;font-size:13px}
  .tab button.chon{background:var(--nhan);color:#0b1220;border-color:var(--nhan);font-weight:600}

  .bao{border-left:3px solid var(--vien);padding:11px 14px;margin:9px 0;
    background:var(--nen-3);border-radius:0 7px 7px 0}
  .bao.chac-chan{border-left-color:var(--do)}
  .bao.can-xac-minh{border-left-color:var(--vang)}
  .bao.ghi-nhan{border-left-color:var(--chu-mo)}
  .bao .dau{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .bao .ma{font:12px/1 ui-monospace,Consolas,monospace;color:var(--chu-mo)}
  .bao .cot{font-weight:600}
  .bao .dem{color:var(--chu-mo);font-size:13px}
  .bao .mo-ta{margin:5px 0 0;font-size:14px}
  .bao .vi-du{margin:6px 0 0;font:12.5px/1.5 ui-monospace,Consolas,monospace;
    color:var(--chu-mo);white-space:pre-wrap;word-break:break-word}
  .bao .de-xuat{margin:6px 0 0;font-size:13px;color:var(--luc)}
  .bao .can-cu{margin:4px 0 0;font-size:12.5px;color:var(--nhan)}

  .luu-y{background:#2a2113;border:1px solid #5a4416;border-radius:8px;
    padding:12px 15px;margin:12px 0;font-size:14px}

  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--vien);padding:7px 10px;text-align:left}
  th{background:var(--nen-3);font-weight:600}
  td.so-lieu{text-align:right;font-variant-numeric:tabular-nums}
  tr.muc td{background:var(--nen-3);font-weight:600;color:var(--nhan)}
  .thut{padding-left:30px;color:var(--chu-mo)}
  .cuon{overflow-x:auto}

  select,button.thao-tac{background:var(--nen-3);color:var(--chu);border:1px solid var(--vien);
    border-radius:7px;padding:9px 15px;font:inherit;font-size:14px;cursor:pointer}
  button.thao-tac:hover{border-color:var(--nhan);color:var(--nhan)}
  button.thao-tac.chinh{background:var(--nhan);color:#0b1220;border-color:var(--nhan);font-weight:600}
  button.thao-tac.chinh:hover{color:#0b1220}
  button.nho{padding:5px 10px;font-size:13px}
  .hang-dieu-khien{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .an{display:none}
  .loi{color:var(--do)}
  .mo{color:var(--chu-mo);font-size:13px}

  /* Hộp thoại phỏng vấn */
  .lop-phu{position:fixed;inset:0;background:rgba(6,9,13,.78);display:flex;
    align-items:center;justify-content:center;padding:22px;z-index:50}
  .hop{background:var(--nen-2);border:1px solid var(--vien);border-radius:12px;
    max-width:720px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px}
  .hop .tien-do{font-size:12.5px;color:var(--chu-mo);letter-spacing:.06em;
    text-transform:uppercase}
  .hop h3{margin:8px 0 10px;font-size:18px;line-height:1.4}
  .hop .mo-ta{margin:0 0 14px;font-size:14.5px;color:var(--chu)}
  .hop .vi-du{font:12.5px/1.6 ui-monospace,Consolas,monospace;color:var(--chu-mo);
    background:var(--nen-3);border-radius:7px;padding:9px 12px;margin:0 0 14px;
    white-space:pre-wrap;word-break:break-word}
  .chon-mot{display:block;width:100%;text-align:left;background:var(--nen-3);
    border:1px solid var(--vien);border-radius:9px;padding:12px 14px;margin:8px 0;
    cursor:pointer;font:inherit;color:var(--chu)}
  .chon-mot:hover{border-color:var(--nhan)}
  .chon-mot .nhan{font-weight:600;display:block}
  .chon-mot .phu{display:block;margin-top:4px;font-size:13px;color:var(--chu-mo)}
  .chon-mot.goi-y .nhan::after{content:" — gợi ý";color:var(--luc);font-weight:400;font-size:13px}
  .vi-sao{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--vien);
    font-size:13px;color:var(--chu-mo)}
  .hop-nut{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

  .da-tra-loi{font-size:13.5px}
  .da-tra-loi li{margin:5px 0}
  .da-tra-loi b{color:var(--luc);font-weight:600}

  /* Danh sách đề xuất sửa */
  .dx{border:1px solid var(--vien);border-radius:9px;padding:12px 14px;margin:10px 0;
    background:var(--nen-3)}
  .dx.tat{opacity:.5}
  .dx label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .dx input[type=checkbox]{margin-top:4px;width:16px;height:16px;flex:0 0 16px;accent-color:var(--nhan)}
  .dx .ten{font-weight:600}
  .dx .mo-ta{margin:4px 0 0;font-size:13.5px;color:var(--chu-mo)}
  .dx .canh{margin:6px 0 0;font-size:13px;color:var(--vang)}
  .dx table{margin-top:10px;font-size:12.5px}
  .dx td,.dx th{padding:4px 8px}
  .dx .cu{color:var(--do);font-family:ui-monospace,Consolas,monospace}
  .dx .moi{color:var(--luc);font-family:ui-monospace,Consolas,monospace}
  .tong-ket{background:var(--nen-3);border:1px solid var(--vien);border-radius:9px;
    padding:14px;margin-top:14px}
</style>
</head>
<body>
<header>
  <h1>DA Assist — rà soát, làm sạch và phân tích tệp Excel</h1>
  <p class="rieng-tu">Tệp của bạn được xử lý ngay trong trình duyệt trên máy này.
    Công cụ không gửi dữ liệu đi đâu và không gọi bất kỳ dịch vụ trí tuệ nhân tạo nào.</p>
</header>

<main>
  <div class="tha" id="tha">
    <strong>Kéo tệp .xlsx vào đây</strong>
    <p>hoặc bấm để chọn tệp</p>
    <p style="font-size:13px">Tệp không rời khỏi máy của bạn.</p>
    <input type="file" id="chon" accept=".xlsx">
  </div>
  <div id="ket-qua" class="an"></div>
</main>

<div id="lop-hoi" class="an"></div>

<script type="module">
import { docXlsx } from "../src/doc-tep/doc-xlsx.js";
import {
  raSoat, dungPhuLuc4, sinhCauHoi, VIEC, heQuaKhoa,
  hoSoMoi, ghiTraLoi, docTraLoi, quyetDinhTu, doKhop,
  sangJson, tuJson, chuKyCauTruc,
  deXuatSua, apDung, trangNhatKy, NHOM, ghiXlsx,
  lietKePhanTich, chayPhanTich, phanTichThanhHang, TEN_NHOM, NGUONG_MAC_DINH,
} from "../src/index.js";
import { veBieuDo, veO } from "./bieu-do.js";

const tha = document.getElementById("tha");
const chon = document.getElementById("chon");
const khung = document.getElementById("ket-qua");
const lopHoi = document.getElementById("lop-hoi");

let trangTinh = [];
let dangXem = 0;
let kq = null;      // kết quả rà soát của trang đang xem
let hoSo = null;    // hồ sơ đơn vị
let giayDoc = "0";
let tenTepGoc = "";

/* ── Nạp tệp ───────────────────────────────────────────────────────── */

tha.addEventListener("click", () => chon.click());
chon.addEventListener("change", (e) => { if (e.target.files[0]) nap(e.target.files[0]); });
for (const t of ["dragenter", "dragover"])
  tha.addEventListener(t, (e) => { e.preventDefault(); tha.classList.add("treo"); });
for (const t of ["dragleave", "drop"])
  tha.addEventListener(t, (e) => { e.preventDefault(); tha.classList.remove("treo"); });
tha.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) nap(f); });

function thoat(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/**
 * Hiện khoảng trắng ra thành ký hiệu nhìn thấy được.
 * Không có nó thì bảng xem trước hiện “Nữ ” và “Nữ” trông y hệt nhau, và người
 * dùng không hiểu công cụ định sửa cái gì.
 */
function hienKhoangTrang(s) {
  const v = String(s == null ? "" : s);
  if (v === "") return `<i class="mo">(để trống)</i>`;
  const danh = v
    .replace(/^[ \t]+/, (m) => "␣".repeat(m.length))
    .replace(/[ \t]+$/, (m) => "␣".repeat(m.length))
    .replace(/[ \t]{2,}/g, (m) => "␣".repeat(m.length));
  return thoat(danh);
}

async function nap(tep) {
  khung.classList.remove("an");
  khung.innerHTML = `<div class="the"><h2>Đang đọc</h2><p>${thoat(tep.name)} — ${(tep.size / 1048576).toFixed(2)} MB</p></div>`;
  try {
    tenTepGoc = tep.name;
    const t0 = performance.now();
    trangTinh = await docXlsx(new Uint8Array(await tep.arrayBuffer()));
    if (!trangTinh.length) throw new Error("Không tìm thấy trang tính nào trong tệp.");
    giayDoc = ((performance.now() - t0) / 1000).toFixed(2);
    dangXem = 0;
    tha.classList.add("gon");
    doiTrang();
  } catch (e) {
    khung.innerHTML = `<div class="the"><h2>Không đọc được tệp</h2>
      <p class="loi">${thoat(e.message)}</p>
      <p>Nếu tệp có đuôi .xls kiểu cũ, hãy mở bằng Excel rồi lưu lại thành .xlsx.</p></div>`;
  }
}

function doiTrang() {
  kq = raSoat(trangTinh[dangXem]);
  hoSo = napHoSo(kq.bang);
  ve();
}

/* ── Hồ sơ đơn vị: nhớ câu trả lời qua các lần mở ──────────────────── */

function bam(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
const khoaLuu = (bang) => "da-assist:hs:" + bam(chuKyCauTruc(bang));

function napHoSo(bang) {
  try {
    const t = localStorage.getItem(khoaLuu(bang));
    if (t) {
      const h = tuJson(t);
      if (doKhop(h, bang) > 0.8) return h;
    }
  } catch (e) { /* hồ sơ cũ hỏng thì bỏ, dựng hồ sơ mới */ }
  return hoSoMoi(bang, { ten: bang.ten });
}

function luuHoSo() {
  try { localStorage.setItem(khoaLuu(kq.bang), sangJson(hoSo)); } catch (e) { /* bỏ qua */ }
}

/* ── Hộp thoại phỏng vấn ───────────────────────────────────────────── */

/**
 * Hỏi lần lượt các câu cần cho một việc.
 * Trả về true nếu người dùng đi hết, false nếu huỷ giữa chừng.
 */
function phongVan(viec, cotLienQuan = null) {
  const ds = sinhCauHoi(kq.bang, kq.nhanDang.theoVaiTro, {
    viec, cotLienQuan, daTraLoi: docTraLoi(hoSo),
  }).canHoi;
  if (!ds.length) return Promise.resolve(true);

  return new Promise((xong) => {
    let i = 0;
    lopHoi.classList.remove("an");

    const dong = (ok) => { lopHoi.classList.add("an"); lopHoi.innerHTML = ""; xong(ok); };

    const veCau = () => {
      const c = ds[i];
      lopHoi.innerHTML = `
        <div class="lop-phu">
          <div class="hop">
            <div class="tien-do">Câu ${i + 1} / ${ds.length}</div>
            <h3>${thoat(c.tieuDe)}</h3>
            <p class="mo-ta">${thoat(c.moTa)}</p>
            ${c.viDu && c.viDu.length
              ? `<p class="vi-du">Giá trị có thật trong tệp:\n${thoat(c.viDu.join("\n"))}</p>` : ""}
            <div id="ds-chon">${c.luaChon.map((l, k) =>
              `<button class="chon-mot ${l.ma === c.goiY ? "goi-y" : ""}" data-k="${k}">
                 <span class="nhan">${thoat(l.nhan)}</span>
                 ${l.moTa ? `<span class="phu">${thoat(l.moTa)}</span>` : ""}
               </button>`).join("")}</div>
            <p class="vi-sao"><b>Vì sao hỏi:</b> ${thoat(c.viSaoHoi)}</p>
            <div class="hop-nut">
              <button class="thao-tac nho" id="nut-bo-qua">Bỏ qua câu này</button>
              <button class="thao-tac nho" id="nut-huy">Huỷ</button>
            </div>
          </div>
        </div>`;

      lopHoi.querySelectorAll(".chon-mot").forEach((b) =>
        b.addEventListener("click", () => {
          ghiTraLoi(hoSo, c.ma, c.luaChon[+b.dataset.k].ma);
          luuHoSo();
          tiep();
        }));
      document.getElementById("nut-bo-qua").addEventListener("click", tiep);
      document.getElementById("nut-huy").addEventListener("click", () => dong(false));
    };

    const tiep = () => { i++; if (i >= ds.length) dong(true); else veCau(); };
    veCau();
  });
}

/* ── Vẽ màn hình chính ─────────────────────────────────────────────── */

function ve(giuPhan = null) {
  const tenHinh = { "danh-sach": "danh sách từng ca", "bieu-tong-hop": "biểu đã cộng",
    "chua-xac-dinh": "chưa xác định" }[kq.tomTat.hinhDang];

  const tab = trangTinh.length > 1
    ? `<div class="tab">${trangTinh.map((x, i) =>
        `<button data-i="${i}" class="${i === dangXem ? "chon" : ""}">${thoat(x.ten)}</button>`).join("")}</div>`
    : "";

  const nhomBao = (muc) => kq.phatHien.filter((p) => p.mucDo === muc).map(veBao).join("")
    || `<p class="mo">Không có mục nào.</p>`;

  const laDanhSach = kq.tomTat.hinhDang !== "bieu-tong-hop";
  const laHivInfo = kq.nhanDang.ketQua === "nhan-ra"
    && kq.nhanDang.hoSo.ma === "hivinfo-giam-sat-ca-benh";

  // Với biểu đã cộng thì nhận dạng theo danh mục biểu, không theo hồ sơ danh sách:
  // nói "chưa nhận ra loại tệp chuyên môn" trên một biểu báo cáo quý là nói sai việc.
  function moTaNhanDang(k, danhSach) {
    if (danhSach) return k.nhanDang.moTa;
    return (k.nhanDangBieu && k.nhanDangBieu.moTa) || "";
  }

  khung.innerHTML = `
    ${tab}
    <div class="the">
      <h2>Tổng quan</h2>
      <div class="luoi">
        <div class="so">${kq.tomTat.soDong.toLocaleString("vi-VN")}<small>dòng dữ liệu</small></div>
        <div class="so">${kq.tomTat.soCot}<small>cột</small></div>
        <div class="so">${kq.tomTat.hangTieuDe}<small>dòng tiêu đề</small></div>
        <div class="so chu">${tenHinh}<small>hình dạng tệp</small></div>
        <div class="so">${giayDoc}s<small>thời gian đọc</small></div>
      </div>
      <p style="margin:14px 0 0;font-size:14px">${thoat(moTaNhanDang(kq, laDanhSach))}</p>
      ${kq.canhBaoLuong.map((c) => `<div class="luu-y">${thoat(c)}</div>`).join("")}
    </div>

    <div class="the">
      <h2>Việc cần làm</h2>
      <p class="mo" style="margin:0 0 12px">
        Công cụ hỏi bạn về ý nghĩa của cột <b>đúng lúc cần</b>, và chỉ hỏi những cột mà
        việc bạn chọn thực sự chạm tới. Trả lời rồi thì lần sau không hỏi lại.</p>
      <div class="hang-dieu-khien">
        ${laDanhSach ? `<button class="thao-tac chinh" id="nut-sach">Làm sạch dữ liệu</button>` : ""}
        ${laDanhSach ? `<button class="thao-tac chinh" id="nut-trung">Tìm bản ghi trùng</button>` : ""}
        ${laDanhSach ? `<button class="thao-tac chinh" id="nut-phan-tich">Phân tích số liệu</button>` : ""}
        ${laHivInfo ? `<button class="thao-tac chinh" id="nut-bieu">Dựng Phụ lục 4</button>` : ""}
        <button class="thao-tac" id="nut-xem-tra-loi">Những gì tôi đã cho biết</button>
      </div>
      <div id="khung-viec"></div>
    </div>

    <div class="the">
      <h2>Cần sửa — máy chắc chắn (${kq.tomTat.soChacChan})</h2>${nhomBao("chac-chan")}
    </div>
    <div class="the">
      <h2>Cần người xem lại (${kq.tomTat.soCanXacMinh})</h2>${nhomBao("can-xac-minh")}
    </div>
    <div class="the">
      <h2>Ghi nhận — không phải lỗi (${kq.tomTat.soGhiNhan})</h2>${nhomBao("ghi-nhan")}
    </div>`;

  khung.querySelectorAll(".tab button").forEach((b) =>
    b.addEventListener("click", () => { dangXem = +b.dataset.i; doiTrang(); }));
  const g = (id) => document.getElementById(id);
  if (g("nut-sach")) g("nut-sach").addEventListener("click", lamLamSach);
  if (g("nut-trung")) g("nut-trung").addEventListener("click", lamTimTrung);
  if (g("nut-phan-tich")) g("nut-phan-tich").addEventListener("click", lamPhanTich);
  if (g("nut-bieu")) g("nut-bieu").addEventListener("click", lamBieuMau);
  g("nut-xem-tra-loi").addEventListener("click", veTraLoi);

  if (giuPhan) giuPhan();
}

function veBao(p) {
  return `<div class="bao ${p.mucDo}">
    <div class="dau">
      <span class="ma">${thoat(p.ma)}</span>
      <span class="cot">${thoat(p.cot)}</span>
      ${p.soDong ? `<span class="dem">${p.soDong.toLocaleString("vi-VN")} dòng</span>` : ""}
    </div>
    <p class="mo-ta">${thoat(p.moTa)}</p>
    ${p.viDu && p.viDu.length ? `<p class="vi-du">${thoat(p.viDu.slice(0, 4).join("\n"))}</p>` : ""}
    ${p.canCu ? `<p class="can-cu">Căn cứ: ${thoat(p.canCu)}</p>` : ""}
    ${p.deXuat ? `<p class="de-xuat">→ ${thoat(p.deXuat)}</p>` : ""}
  </div>`;
}

/* ── Việc 1: làm sạch dữ liệu ──────────────────────────────────────── */

async function lamLamSach() {
  // Hỏi trước những câu mà phép sửa thật sự cần: thứ tự ngày và nghĩa của giá
  // trị hiếm. Chỉ hỏi về các cột mà việc làm sạch chạm tới.
  const dx0 = deXuatSua(kq.bang, kq.phatHien, quyetDinhTu(hoSo, kq.bang));
  const cot = new Set(dx0.flatMap((d) => d.thayDoi.map((t) => t.cot)));
  const bc = sinhCauHoi(kq.bang, kq.nhanDang.theoVaiTro).bangChung;
  for (const gt of bc.giaTriHiem) cot.add(gt.cot.chiSo);
  if (!(await phongVan(VIEC.SUA_DU_LIEU, [...cot]))) return;

  // Trả lời xong mới dựng lại đề xuất, vì câu trả lời có thể thêm nhóm gộp giá
  // trị hoặc đổi cách đọc ngày.
  veDeXuat(deXuatSua(kq.bang, kq.phatHien, quyetDinhTu(hoSo, kq.bang)));
}

function veDeXuat(dx) {
  const o = document.getElementById("khung-viec");
  if (!dx.length) {
    o.innerHTML = `<p class="mo">Không có phép sửa nào để đề xuất — tệp đã sạch ở
      những khía cạnh mà máy chắc chắn.</p>`;
    return;
  }

  const the = dx.map((d, i) => `
    <div class="dx" data-i="${i}">
      <label>
        <input type="checkbox" data-i="${i}" checked>
        <span>
          <span class="ten">${thoat(d.nhan)}</span>
          <span class="dem mo"> — ${d.boDong
            ? `${d.soDong} dòng` : `${d.soO.toLocaleString("vi-VN")} ô`}</span>
          <span class="mo-ta">${thoat(d.moTa)}</span>
          ${d.canhBao ? `<span class="canh">${thoat(d.canhBao)}</span>` : ""}
        </span>
      </label>
      ${d.xemTruoc.length ? `
        <div class="cuon"><table>
          <thead><tr><th style="width:90px">Dòng</th><th>Cột</th>
            <th>Giá trị hiện tại</th><th>Sẽ đổi thành</th></tr></thead>
          <tbody>${d.xemTruoc.map((x) => `<tr>
            <td>${x.dong}</td><td>${thoat(x.cot)}</td>
            <td class="cu">${hienKhoangTrang(x.cu)}</td>
            <td class="moi">${hienKhoangTrang(x.moi)}</td>
          </tr>`).join("")}</tbody>
        </table></div>
        ${d.soO > d.xemTruoc.length
          ? `<p class="mo" style="margin:6px 0 0">Xem trước ${d.xemTruoc.length} ô đầu trên tổng ${d.soO.toLocaleString("vi-VN")}.</p>`
          : ""}` : ""}
    </div>`).join("");

  o.innerHTML = `
    <p style="margin:0 0 10px">Chọn những nhóm bạn muốn áp dụng. Mỗi nhóm có bảng xem
      trước giá trị hiện tại và giá trị sau khi sửa.</p>
    ${the}
    <div class="tong-ket">
      <div id="tom-tat-chon"></div>
      <div class="hang-dieu-khien" style="margin:12px 0 0">
        <button class="thao-tac chinh" id="nut-tao-tep">Tạo tệp đã làm sạch</button>
        <button class="thao-tac" id="nut-chon-het">Chọn hết</button>
        <button class="thao-tac" id="nut-bo-het">Bỏ chọn hết</button>
      </div>
      <p class="mo" style="margin:10px 0 0">Tệp gốc của bạn <b>không bị thay đổi</b>.
        Công cụ tạo một tệp mới, kèm một trang nhật ký ghi rõ đã đổi gì ở dòng nào.</p>
    </div>`;

  const capNhat = () => {
    let soO = 0;
    let soDong = 0;
    let soNhom = 0;
    o.querySelectorAll('input[type=checkbox]').forEach((c) => {
      const d = dx[+c.dataset.i];
      o.querySelector(`.dx[data-i="${c.dataset.i}"]`).classList.toggle("tat", !c.checked);
      if (!c.checked) return;
      soNhom++;
      soO += d.soO;
      if (d.boDong) soDong += d.boDong.length;
    });
    document.getElementById("tom-tat-chon").innerHTML = soNhom
      ? `Đã chọn <b>${soNhom}</b> nhóm: sửa <b>${soO.toLocaleString("vi-VN")}</b> ô,
         bỏ <b>${soDong}</b> dòng. Số dòng sau khi sửa:
         <b>${(kq.bang.dong.length - soDong).toLocaleString("vi-VN")}</b>.`
      : `<span class="mo">Chưa chọn nhóm nào.</span>`;
  };

  o.querySelectorAll('input[type=checkbox]').forEach((c) =>
    c.addEventListener("change", capNhat));
  document.getElementById("nut-chon-het").addEventListener("click", () => {
    o.querySelectorAll('input[type=checkbox]').forEach((c) => { c.checked = true; });
    capNhat();
  });
  document.getElementById("nut-bo-het").addEventListener("click", () => {
    o.querySelectorAll('input[type=checkbox]').forEach((c) => { c.checked = false; });
    capNhat();
  });
  document.getElementById("nut-tao-tep").addEventListener("click", () => taoTep(dx));
  capNhat();
}

async function taoTep(dx) {
  const nut = document.getElementById("nut-tao-tep");
  const chon = [...document.querySelectorAll("#khung-viec input[type=checkbox]")]
    .filter((c) => c.checked).map((c) => dx[+c.dataset.i].ma);
  if (!chon.length) { alert("Chưa chọn nhóm nào để áp dụng."); return; }

  nut.disabled = true;
  nut.textContent = "Đang tạo tệp…";
  try {
    const r = apDung(kq.bang, dx, chon);
    const tep = await ghiXlsx([
      { ten: "Du lieu da lam sach", hang: r.hang },
      trangNhatKy(r.nhatKy, r.tomTat, tenTepGoc),
    ]);
    const ten = tenTepGoc.replace(/\.xlsx$/i, "") + "_da_lam_sach.xlsx";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([tep], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    a.download = ten;
    a.click();
    URL.revokeObjectURL(a.href);

    document.getElementById("tom-tat-chon").innerHTML =
      `Đã tạo <b>${thoat(ten)}</b> — sửa <b>${r.tomTat.soODaSua.toLocaleString("vi-VN")}</b> ô,
       bỏ <b>${r.tomTat.soDongDaBo}</b> dòng, còn
       <b>${r.tomTat.soDongSau.toLocaleString("vi-VN")}</b> dòng.
       Nhật ký ${r.nhatKy.length.toLocaleString("vi-VN")} mục nằm ở trang thứ hai của tệp.`;
  } catch (e) {
    alert("Không tạo được tệp: " + e.message);
  } finally {
    nut.disabled = false;
    nut.textContent = "Tạo tệp đã làm sạch";
  }
}

/* ── Việc 2: tìm bản ghi trùng ─────────────────────────────────────── */

async function lamTimTrung() {
  if (!(await phongVan(VIEC.GOP_TRUNG))) return;
  const qd = quyetDinhTu(hoSo, kq.bang);
  const o = document.getElementById("khung-viec");

  if (!qd.khoaNhanDang) {
    o.innerHTML = `<p class="mo">Bạn đã bỏ qua câu hỏi, nên công cụ chưa biết
      lấy bộ cột nào làm căn cứ. Không thực hiện gì cả.</p>`;
    return;
  }
  if (!qd.khoaNhanDang.length) {
    o.innerHTML = `<p class="mo">Bạn chọn chưa gộp gì. Công cụ không thay đổi dữ liệu.</p>`;
    return;
  }

  const r = heQuaKhoa(kq.bang, qd.khoaNhanDang);
  const tenKhoa = qd.khoaNhanDang.map((c) => kq.bang.tieuDe[c]);
  const hangBang = r.nhom.slice(0, 25).map((nhom) => {
    const d = kq.bang.dong[nhom[0]];
    const gt = qd.khoaNhanDang.map((c) =>
      d[c] instanceof Date ? d[c].toISOString().slice(0, 10) : String(d[c] ?? ""));
    return `<tr><td>${thoat(gt.join(" · "))}</td>
      <td class="so-lieu">${nhom.length}</td>
      <td>${nhom.map((i) => i + 2).join(", ")}</td></tr>`;
  }).join("");

  o.innerHTML = `
    <p style="margin:0 0 10px">Căn cứ nhận dạng bạn đã chọn:
      <b>${thoat(tenKhoa.join(" + "))}</b></p>
    <div class="luoi" style="margin-bottom:14px">
      <div class="so">${r.soNhom}<small>nhóm nghi trùng</small></div>
      <div class="so">${r.soDongThua}<small>dòng thừa nếu gộp</small></div>
      <div class="so">${r.soDongThieu}<small>dòng thiếu thông tin để so</small></div>
      <div class="so">${(kq.bang.dong.length - r.soDongThua).toLocaleString("vi-VN")}<small>số dòng sau khi gộp</small></div>
    </div>
    <div class="cuon"><table>
      <thead><tr><th>Giá trị khoá</th><th style="width:90px">Số dòng</th><th>Ở các dòng</th></tr></thead>
      <tbody>${hangBang}</tbody>
    </table></div>
    ${r.soNhom > 25 ? `<p class="mo">Hiện 25 nhóm đầu trên tổng ${r.soNhom}.</p>` : ""}
    <div class="luu-y">Công cụ mới chỉ <b>khoanh vùng</b>, chưa xoá dòng nào.
      Phần áp dụng phép gộp có bảng xem trước từng ô và ghi ra tệp mới, đang được dựng.</div>`;
}

/* ── Việc 3: phân tích số liệu ─────────────────────────────────────── */

let maDangXem = null;
let tuyChonPT = {};

/**
 * KHÔNG hỏi gì trước khi hiện danh mục. Người dùng mới chỉ muốn biết công cụ làm
 * được những phân tích nào; bắt trả lời hai chục câu ở bước này là dựng rào ngay
 * cửa. Câu hỏi để dành đến lúc mở một phân tích cụ thể, và chỉ hỏi về đúng những
 * cột mà phân tích ấy dùng.
 */
function lamPhanTich() {
  veDanhMucPhanTich();
}

function veDanhMucPhanTich() {
  const ds = lietKePhanTich(kq.bang, kq.nhanDang.theoVaiTro, {
    qd: quyetDinhTu(hoSo, kq.bang),
  });
  const soChay = ds.filter((x) => x.chayDuoc).length;

  const theoNhom = ["A", "B", "C", "D"].map((n) => {
    const muc = ds.filter((x) => x.nhom === n);
    return `<div style="margin:12px 0 0">
      <div class="mo" style="text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">
        Nhóm ${n} — ${thoat(TEN_NHOM[n])}</div>
      ${muc.map((x) => `
        <div class="dx ${x.chayDuoc ? "" : "tat"}" style="padding:9px 12px">
          <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
            <span class="ma" style="font:12px ui-monospace,Consolas,monospace;color:var(--chu-mo)">${x.ma}</span>
            <span class="ten">${thoat(x.ten)}</span>
            ${x.chayDuoc
              ? `<button class="thao-tac nho" data-pt="${x.ma}" style="margin-left:auto">Xem</button>`
              : ""}
          </div>
          <p class="mo-ta" style="margin:4px 0 0">${thoat(x.moTa)}</p>
          ${x.lyDo ? `<p class="canh" style="margin:5px 0 0;font-size:13px;color:var(--vang)">${thoat(x.lyDo)}</p>` : ""}
        </div>`).join("")}
    </div>`;
  }).join("");

  document.getElementById("khung-viec").innerHTML = `
    <p style="margin:0 0 6px">Có <b>${soChay}</b> trên ${ds.length} phân tích chạy được với tệp này.
      Những phân tích còn lại vẫn hiện, kèm lý do — để bạn biết công cụ làm được gì
      chứ không phải nó không hỗ trợ.</p>
    <div class="hang-dieu-khien" style="margin:10px 0 0">
      <label><input type="checkbox" id="che-o-nho" style="width:16px;height:16px;accent-color:var(--nhan);vertical-align:-2px">
        Che ô có số nhỏ hơn ${NGUONG_MAC_DINH}</label>
      <span class="mo">— bật khi định sao chép bảng ra ngoài</span>
    </div>
    ${theoNhom}
    <div id="khung-kq-pt"></div>`;

  document.querySelectorAll("#khung-viec button[data-pt]").forEach((b) =>
    b.addEventListener("click", async () => {
      const pt = ds.find((x) => x.ma === b.dataset.pt);
      // Hỏi đúng lúc mở phân tích, và chỉ hỏi về cột mà phân tích ấy dùng.
      if (pt.chiSoCot.length && !(await phongVan(VIEC.PHAN_TICH, pt.chiSoCot))) return;
      xemPhanTich(b.dataset.pt);
    }));
  document.getElementById("che-o-nho").addEventListener("change", () => {
    if (maDangXem) xemPhanTich(maDangXem);
  });
}

function xemPhanTich(ma) {
  maDangXem = ma;
  const che = document.getElementById("che-o-nho").checked;
  const r = chayPhanTich(kq.bang, kq.nhanDang.theoVaiTro, ma, {
    qd: quyetDinhTu(hoSo, kq.bang),
    phatHien: kq.phatHien,
    tuyChonPhanTich: tuyChonPT[ma] || {},
    che,
    nguong: NGUONG_MAC_DINH,
  });

  const o = document.getElementById("khung-kq-pt");
  if (!r.chayDuoc) {
    o.innerHTML = `<div class="the"><h2>${thoat(r.ten)}</h2><p class="canh">${thoat(r.lyDo)}</p></div>`;
    return;
  }

  const veBang = (b, ten) => {
    const dd = b.dinhDang || b.tieuDe.map((_, i) => (i === 0 ? "chu" : "so"));
    return `${ten ? `<h3 style="font-size:14px;margin:14px 0 6px">${thoat(ten)}</h3>` : ""}
      <div class="cuon"><table>
        <thead><tr>${b.tieuDe.map((t) => `<th>${thoat(t)}</th>`).join("")}</tr></thead>
        <tbody>${b.hang.map((h) => `<tr>${h.map((v, i) =>
          `<td class="${dd[i] === "chu" ? "" : "so-lieu"}">${thoat(veO(v, dd[i]))}</td>`).join("")}</tr>`).join("")}</tbody>
        ${b.tongCot ? `<tfoot><tr>${b.tongCot.map((v, i) =>
          `<th class="${dd[i] === "chu" ? "" : "so-lieu"}">${thoat(veO(v, dd[i]))}</th>`).join("")}</tr></tfoot>` : ""}
      </table></div>`;
  };

  const pt = lietKePhanTich(kq.bang, kq.nhanDang.theoVaiTro).find((x) => x.ma === ma);
  const chonTuyChon = pt && pt.tuyChon
    ? Object.entries(pt.tuyChon).map(([khoa, t]) => `
        <div class="hang-dieu-khien" style="margin:0 0 10px">
          <label for="tc-${khoa}">${thoat(t.ten)}</label>
          <select id="tc-${khoa}" data-khoa="${khoa}">
            ${t.muc.map((m) => `<option value="${m.ma}"
              ${(tuyChonPT[ma] || {})[khoa] === m.ma || (!((tuyChonPT[ma] || {})[khoa]) && m.ma === t.macDinh) ? "selected" : ""}
              >${thoat(m.ten)} — ${thoat(m.canCu)}</option>`).join("")}
          </select>
        </div>`).join("")
    : "";

  o.innerHTML = `<div class="the">
    <h2>${thoat(r.ma)}. ${thoat(r.ten)}</h2>
    ${chonTuyChon}
    ${r.bieuDo ? `<div style="margin:0 0 12px">${veBieuDo(r.bieuDo)}</div>` : ""}
    ${veBang(r.bang, null)}
    ${(r.bangPhu || []).map((x) => veBang(x.bang, x.ten)).join("")}
    ${r.canCu ? `<p class="can-cu" style="margin:10px 0 0;color:var(--nhan);font-size:13px">Căn cứ: ${thoat(r.canCu)}</p>` : ""}
    ${(r.ghiChu || []).map((g) => `<div class="luu-y">${thoat(g)}</div>`).join("")}
    <div class="hang-dieu-khien" style="margin:12px 0 0">
      <button class="thao-tac" id="nut-tai-pt">Tải bảng này về</button>
      <button class="thao-tac" id="nut-chep-pt">Sao chép để dán</button>
    </div>
  </div>`;

  o.querySelectorAll("select[data-khoa]").forEach((s) =>
    s.addEventListener("change", () => {
      tuyChonPT[ma] = { ...(tuyChonPT[ma] || {}), [s.dataset.khoa]: s.value };
      xemPhanTich(ma);
    }));

  document.getElementById("nut-tai-pt").addEventListener("click", async () => {
    const tep = await ghiXlsx([{ ten: `Phan tich ${r.ma}`, hang: phanTichThanhHang(r) }]);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([tep], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    a.download = `${tenTepGoc.replace(/\.xlsx$/i, "")}_${r.ma}.xlsx`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById("nut-chep-pt").addEventListener("click", async () => {
    const vb = phanTichThanhHang(r).map((h) => h.join("\t")).join("\n");
    try {
      await navigator.clipboard.writeText(vb);
      document.getElementById("nut-chep-pt").textContent = che
        ? "Đã sao chép (đã che ô nhỏ)"
        : "Đã sao chép — chưa che ô nhỏ";
    } catch (e) {
      alert("Trình duyệt không cho sao chép tự động. Hãy bôi đen bảng rồi sao chép bằng tay.");
    }
  });

  o.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ── Việc 4: dựng Phụ lục 4 ────────────────────────────────────────── */

const VAI_TRO_BIEU = ["ngay_khang_dinh", "gioi_tinh", "ngoai_tinh",
  "ket_luan_nhiem_moi", "ngay_tu_vong", "trang_thai_nguoi_nhiem"];

async function lamBieuMau() {
  const cot = VAI_TRO_BIEU.map((v) => kq.nhanDang.theoVaiTro.get(v)).filter((x) => x != null);
  if (!(await phongVan(VIEC.DUNG_BIEU_MAU, cot))) return;

  const namNay = new Date().getUTCFullYear();
  const muc = [];
  for (let n = namNay; n >= namNay - 5; n--) {
    muc.push(`<option value="${n}|">Năm ${n}</option>`);
    for (let q = 4; q >= 1; q--) muc.push(`<option value="${n}|${q}">Quý ${q} năm ${n}</option>`);
  }
  document.getElementById("khung-viec").innerHTML = `
    <div class="hang-dieu-khien">
      <label for="ky-bao-cao">Kỳ báo cáo</label>
      <select id="ky-bao-cao">${muc.join("")}</select>
    </div>
    <div id="khung-bieu"></div>`;
  document.getElementById("ky-bao-cao").addEventListener("change", veBieu);
  veBieu();
}

function veBieu() {
  const [nam, quy] = document.getElementById("ky-bao-cao").value.split("|");
  const r = dungPhuLuc4(kq.bang, kq.nhanDang.theoVaiTro,
    { nam: +nam, quy: quy ? +quy : null });
  const o = document.getElementById("khung-bieu");
  if (!r.dungDuoc) {
    o.innerHTML = `<p class="loi">Không dựng được biểu: thiếu ${thoat(r.thieu.join(", "))}.</p>`;
    return;
  }
  const hang = r.dong.map((d) => d.tieuDeMuc
    ? `<tr class="muc"><td>${thoat(d.muc)}</td><td colspan="4">${thoat(d.noiDung)}</td></tr>`
    : `<tr><td>${thoat(d.muc)}</td>
         <td class="${d.capDo > 1 ? "thut" : ""}">${thoat(d.noiDung)}</td>
         <td class="so-lieu">${d.nam.toLocaleString("vi-VN")}</td>
         <td class="so-lieu">${d.nu.toLocaleString("vi-VN")}</td>
         <td class="so-lieu">${d.tong.toLocaleString("vi-VN")}</td></tr>`).join("");
  o.innerHTML = `
    <div class="cuon"><table>
      <thead><tr><th style="width:52px">STT</th><th>Nội dung báo cáo</th>
        <th style="width:90px">Nam</th><th style="width:90px">Nữ</th><th style="width:90px">Tổng</th></tr></thead>
      <tbody>${hang}</tbody></table></div>
    ${r.ghiChu.map((g) => `<div class="luu-y">${thoat(g)}</div>`).join("")}`;
}

/* ── Việc 5: xem và quản lý những gì đã trả lời ────────────────────── */

function veTraLoi() {
  const { tatCa } = sinhCauHoi(kq.bang, kq.nhanDang.theoVaiTro);
  const daTL = docTraLoi(hoSo);
  const co = tatCa.filter((c) => daTL[c.ma] !== undefined);
  const o = document.getElementById("khung-viec");

  const muc = co.map((c) => {
    const l = c.luaChon.find((x) => x.ma === daTL[c.ma]);
    return `<li>${thoat(c.tieuDe)} → <b>${thoat(l ? l.nhan : daTL[c.ma])}</b></li>`;
  }).join("");

  o.innerHTML = `
    ${co.length
      ? `<p style="margin:0 0 8px">Bạn đã cho công cụ biết ${co.length} điều về tệp này:</p>
         <ul class="da-tra-loi">${muc}</ul>`
      : `<p class="mo">Bạn chưa cho biết điều gì. Công cụ sẽ hỏi khi bạn chọn một việc ở trên.</p>`}
    <div class="hang-dieu-khien" style="margin:14px 0 0">
      <button class="thao-tac nho" id="nut-tai-hs">Lưu ra tệp</button>
      <button class="thao-tac nho" id="nut-nap-hs">Nạp từ tệp</button>
      ${co.length ? `<button class="thao-tac nho" id="nut-xoa-hs">Xoá hết câu trả lời</button>` : ""}
      <input type="file" id="tep-hs" accept=".json">
    </div>
    <p class="mo" style="margin:10px 0 0">Tệp hồ sơ chỉ chứa câu trả lời của bạn về ý
      nghĩa các cột — <b>không chứa dữ liệu</b>. Gửi được cho đồng nghiệp để cả đơn vị
      không phải trả lời lại.</p>`;

  document.getElementById("nut-tai-hs").addEventListener("click", () => {
    const b = new Blob([sangJson(hoSo)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "ho-so-don-vi.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });
  const tep = document.getElementById("tep-hs");
  document.getElementById("nut-nap-hs").addEventListener("click", () => tep.click());
  tep.addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const h = tuJson(await f.text());
      const k = doKhop(h, kq.bang);
      if (k < 0.6) {
        alert(`Hồ sơ này chỉ khớp ${Math.round(k * 100)}% số cột của tệp đang mở, nên không nạp.`);
        return;
      }
      hoSo = h;
      luuHoSo();
      ve(veTraLoi);
    } catch (err) {
      alert("Không đọc được tệp hồ sơ: " + err.message);
    }
  });
  const xoa = document.getElementById("nut-xoa-hs");
  if (xoa) xoa.addEventListener("click", () => {
    hoSo = hoSoMoi(kq.bang, { ten: kq.bang.ten });
    luuHoSo();
    ve(veTraLoi);
  });
}
</script>
</body>
</html>
